            <p>这里记录的是一些日常生活里的小片段：看到好看的晚霞时拍下的照片、遇到的猫猫，以及平时随手留下的画面。这些事情可能很普通，但在当时都让我愿意停下来留一张照片。把它们整理到网页里，也是在给自己的生活留下一些可以回看的记录。</p>
