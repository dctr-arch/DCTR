<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Introduction</title>
    </head>
    <div id="column"></div>
    <nav id="main_nav">
        <button data-section="overview" class="active">
            <span>个人总览</span>
            <small>-/////////-</small>
        </button>
        <button data-section="about">
            <span>我</span>
            <small>-/////////-</small>
        </button>
        <button data-section="projects">
            <span>做的项目</span>
            <small>-/////////-</small>
        </button>
        <button data-section="hobbies">
            <span>爱好</span>
            <small>-/////////-</small>
        </button>
    </nav>





    <body>
        <section id="overview" class="stage_on">
            <h1>个人总览</h1>
            <p>This is an overview of website.</p>
        </section>

        <section id="about" class="stage_off">
            <h1>我</h1>
            <p>This is about me.</p>
        </section>

        <section id="projects" class="stage_off">
            <h1>做的项目</h1>
            <p>These are my projects.</p>
        </section>

        <section id="hobbies" class="stage_off">
            <h1>爱好</h1>
            <p>These are my hobbies.</p>
        </section>

        <script>
            const nav = document.getElementById("main_nav");

            let currentSection = document.getElementById("overview");
            let currentButton = nav.querySelector('[data-section="overview"]');

            function switch_section(nextSection, nextButton) {
                currentSection.classList.remove("stage_on");
                currentSection.classList.add("stage_off");
                currentButton.classList.remove("active");

                // 把打开的关上
  
                nextSection.classList.remove("stage_off");
                nextSection.classList.add("stage_on");
                nextButton.classList.add("active");
                // 把对应的打开

                currentSection = nextSection;
                currentButton = nextButton;
                // 更新

            }
            

            nav.addEventListener("click", function(event) {
                const button = event.target.closest("button[data-section]");
                if (!button) 
                return;
                const sectionId = button.getAttribute("data-section");
                const nextSection = document.getElementById(sectionId);

                switch_section(nextSection, button);
            });

        </script>
    </body>
